name: Fetch Akash Drama Playlist

on:
  schedule:
    - cron: "*/4 * * * *"   # প্রতি ৪ মিনিট পর
  workflow_dispatch:

jobs:
  fetch_playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo (where workflow runs)
        uses: actions/checkout@v4

      - name: Checkout private repo (akash_drama)
        uses: actions/checkout@v4
        with:
          repository: msplayerapp/akash_drama
          token: ${{ secrets.PRIVATE_TOKEN }}   # নিচে বোঝানো হয়েছে কিভাবে এইটা তৈরি করবে
          path: akash_repo

      - name: Verify playlist.m3u exists
        run: |
          if [ -f "akash_repo/playlist.m3u" ]; then
            echo "✅ playlist.m3u found!"
            head -n 20 akash_repo/playlist.m3u
          else
            echo "❌ playlist.m3u not found in akash_repo!"
            exit 1
          fi

      - name: Process playlist securely (Python)
        run: |
          python3 <<'PY'
          import os, time
          path = "akash_repo/playlist.m3u"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  data = f.read()
              print("✅ Playlist fetched successfully!")
              print("File size:", len(data), "bytes")
          else:
              print("❌ playlist.m3u missing!")
          PY
